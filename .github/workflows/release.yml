# Release: tag vX.Y.Z → image ghcr.io/lvos04/appstore-en-fork:X.Y.Z (nooit latest) met SBOM en provenance;
# digest in release/digests.json en een manifest met ingevulde digest als release-bijlage.
name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Versie controleren
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(cat VERSION)" = "$VERSION" || { echo "VERSION ($(cat VERSION)) ≠ tag ($VERSION)"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bouwen en pushen
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/allinone/Dockerfile
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ghcr.io/lvos04/appstore-en-fork:${{ steps.v.outputs.version }}
          sbom: true
          provenance: mode=max
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          image: ghcr.io/lvos04/appstore-en-fork:${{ steps.v.outputs.version }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
      - name: digests.json en manifest met digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e apps/api
          mkdir -p release
          python - <<'PY'
          import json, os, datetime, pathlib
          version, digest = os.environ["VERSION"], os.environ["DIGEST"]
          pathlib.Path("release/digests.json").write_text(json.dumps({
              "images": [{"repository": "ghcr.io/lvos04/appstore-en-fork", "tag": version, "digest": digest}],
              "commit": os.environ["GITHUB_SHA"],
              "built_at": datetime.datetime.now(datetime.UTC).isoformat().replace("+00:00", "Z"),
          }, indent=2) + "\n")
          PY
          # digest en bron-commit invullen; digest_pending_release is daarna niet meer geaccepteerd (contract 1.3 §9)
          python tools/release_manifest.py deploy/manifest/appstore-en-fork.manifest.yaml \
            release/appstore-en-fork.manifest.yaml --version "$VERSION" --digest "$DIGEST" --commit "$GITHUB_SHA"
          jl-manifest validate --strict release/appstore-en-fork.manifest.yaml
      - name: GitHub-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "appstore-en-fork $GITHUB_REF_NAME" \
            --notes "Image: ghcr.io/lvos04/appstore-en-fork:${{ steps.v.outputs.version }}@${{ steps.build.outputs.digest }}. NIET GEVALIDEERD op een echte NAS; zie CHANGELOG.md." \
            release/digests.json release/sbom.spdx.json release/appstore-en-fork.manifest.yaml
