# CI: lint, typecheck, tests (unit + integratie tegen PostgreSQL + dienst-E2E met Hub-simulator), Alembic up/down,
# OpenAPI-drift, manifestvalidatie (--strict), pip-audit, drift van de contractkopie (1.3) en de Peil-kopie (1.1.1) tegen
# ai-server-manager, de statuspagina in Chromium (axe-core, overloop 320–1440 px, CSP, schermafdrukken, negatieve
# herkomsttests) en de alles-in-één image bouwen + starten (healthcheck apart, procesboom van PID 1).
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_PASSWORD: ci-alleen-voor-tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APPSTORE_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-alleen-voor-tests@127.0.0.1:5432/postgres
      APPSTORE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Afhankelijkheden (runtime met hashes + ontwikkeltools)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e apps/api
          python -m pip install --disable-pip-version-check ruff==0.17.4 mypy==2.4.1 pytest==9.2.0 \
            types-PyYAML==6.0.12.20261103 types-jsonschema==4.26.0.20261006 pip-audit==2.10.1
      - name: Ruff
        working-directory: apps/api
        run: |
          ruff check src tests alembic && ruff format --check src tests alembic
          ruff check ../../tests/e2e ../../tests/ui ../../deploy/allinone ../../tools
          ruff format --check ../../tests/ui ../../tools
      - name: Mypy
        working-directory: apps/api
        run: mypy
      - name: Manifest van deze app valideren (--strict, contract 1.3 §9)
        run: jl-manifest validate --strict --format json deploy/manifest/appstore-en-fork.manifest.yaml
      - name: Unit-tests
        working-directory: apps/api
        run: pytest -q tests/unit
      - name: Contractkopie (1.3) — byte-gelijk met de gepinde bron-commit van ai-server-manager
        # offline: sha256 van de kopieën = pin; online: de bron op de gepinde commit heeft exact die sha256 (fout bij
        # verschil), een nieuwere bron op de werkbranch is een waarschuwing (bewust overnemen)
        run: python tools/contract_kopie.py controleer && python tools/contract_kopie.py vergelijk --online
      - name: Peil-kopie (O-14) — drift tegen ai-server-manager
        # offline: kop, inhoud en HERKOMST.json; online: gepinde commit exact gelijk, zelfde versie op de bronbranch
        # met andere inhoud = drift (fout), nieuwere versie = waarschuwing (bewust bijwerken)
        run: python tools/peil_kopie.py controleer && python tools/peil_kopie.py vergelijk --online
      - name: Integratietests (PostgreSQL)
        working-directory: apps/api
        run: pytest -q tests/integration
      - name: Alembic up → down → up
        env:
          APPSTORE_DATABASE_URL: postgresql+psycopg://postgres:ci-alleen-voor-tests@127.0.0.1:5432/postgres
        run: |
          appstore migrate && appstore migrate --down base && appstore migrate
          if appstore db-pending; then echo "migraties openstaand na upgrade" && exit 1; fi
      - name: OpenAPI-drift
        run: |
          appstore openapi --out /tmp/openapi.json
          diff -u docs/openapi/appstore-en-fork.openapi.json /tmp/openapi.json
      - name: Dienst-E2E (echte processen + Hub-simulator)
        run: pytest -q tests/e2e/test_service_e2e.py
      - name: pip-audit
        run: pip-audit -r apps/api/requirements.lock --require-hashes --disable-pip --progress-spinner off

  statuspagina-ui:
    # statuspagina in Peil (ONTWERPTAAL §12/§13.2): de echte app rendert elke toestand (Hub-simulator, PostgreSQL);
    # Chromium toetst axe-core = 0, geen overloop op 320–1440 px, CSP zonder JS, doelen ≥ 44 px, tekst ≥ 14 px, focus
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_PASSWORD: ci-alleen-voor-tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APPSTORE_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-alleen-voor-tests@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Afhankelijkheden (Python met hashes, npm ci met lockfile)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e apps/api
          cd tests/ui && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Toestanden uit de echte app (niet gekoppeld, koppelen mislukt, gekoppeld, ingetrokken, niet gereed, …)
        run: python tests/ui/genereer_toestanden.py --uit tests/ui/uit
      - name: Playwright (axe-core, overloop, CSP, toetsenbord) + schermafdrukken
        working-directory: tests/ui
        env:
          SCHERMAFDRUKKEN: "1"
        run: npx playwright test
      - name: Ontwerpreview tegen de draaiende dienst (serve + worker + Hub-simulator; echte formulier-POST in Chromium)
        run: python tests/ui/review_live.py --meting "$RUNNER_TEMP/peil-review"
      - name: Schermafdrukken bewaren
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statuspagina-peil
          path: |
            docs/screenshots/peil/statuspagina/*.png
            tests/ui/uit/
            ${{ runner.temp }}/peil-review/
          retention-days: 14

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Alles-in-één image bouwen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/allinone/Dockerfile
          load: true
          push: false
          tags: appstore-en-fork:ci
      - name: Testafhankelijkheden
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e apps/api
          python -m pip install --disable-pip-version-check pytest==9.2.0
      - name: Image starten met healthcheck (root, 568, herstart, harde kill, back-up vóór migratie, rechten)
        env:
          APPSTORE_E2E_IMAGE: appstore-en-fork:ci
        run: pytest -q tests/e2e/test_allinone_image.py
