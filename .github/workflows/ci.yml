# CI: lint, typecheck, tests (unit + integratie tegen PostgreSQL + dienst-E2E met Hub-simulator), Alembic up/down,
# OpenAPI-drift, manifestvalidatie, pip-audit, en de alles-in-één image bouwen + starten met healthcheck.
name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_PASSWORD: ci-alleen-voor-tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APPSTORE_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-alleen-voor-tests@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Afhankelijkheden (runtime met hashes + ontwikkeltools)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e apps/api
          python -m pip install --disable-pip-version-check ruff==0.17.4 mypy==2.4.1 pytest==9.2.0 \
            types-PyYAML==6.0.12.20261103 types-jsonschema==4.26.0.20261006 pip-audit==2.10.1
      - name: Ruff
        working-directory: apps/api
        run: ruff check src tests alembic && ruff format --check src tests alembic && ruff check ../../tests/e2e ../../deploy/allinone
      - name: Mypy
        working-directory: apps/api
        run: mypy
      - name: Manifest van deze app valideren
        run: jl-manifest validate --format json deploy/manifest/appstore-en-fork.manifest.yaml
      - name: Unit-tests
        working-directory: apps/api
        run: pytest -q tests/unit
      - name: Integratietests (PostgreSQL)
        working-directory: apps/api
        run: pytest -q tests/integration
      - name: Alembic up → down → up
        env:
          APPSTORE_DATABASE_URL: postgresql+psycopg://postgres:ci-alleen-voor-tests@127.0.0.1:5432/postgres
        run: |
          appstore migrate && appstore migrate --down base && appstore migrate
          if appstore db-pending; then echo "migraties openstaand na upgrade" && exit 1; fi
      - name: OpenAPI-drift
        run: |
          appstore openapi --out /tmp/openapi.json
          diff -u docs/openapi/appstore-en-fork.openapi.json /tmp/openapi.json
      - name: Dienst-E2E (echte processen + Hub-simulator)
        run: pytest -q tests/e2e/test_service_e2e.py
      - name: pip-audit
        run: pip-audit -r apps/api/requirements.lock --require-hashes --disable-pip --progress-spinner off

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Alles-in-één image bouwen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/allinone/Dockerfile
          load: true
          push: false
          tags: appstore-en-fork:ci
      - name: Testafhankelijkheden
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e apps/api
          python -m pip install --disable-pip-version-check pytest==9.2.0
      - name: Image starten met healthcheck (root, 568, herstart, harde kill, back-up vóór migratie, rechten)
        env:
          APPSTORE_E2E_IMAGE: appstore-en-fork:ci
        run: pytest -q tests/e2e/test_allinone_image.py
