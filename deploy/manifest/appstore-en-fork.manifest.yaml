# Manifest (manifeststandaard v1, platformcontract 1.3 §9) van appstore-en-fork zelf.
# Installatie uitsluitend als standaard TrueNAS Custom App (één image + formulierwaarden); nooit compose/YAML.
# De digest van de eigen GHCR-image vult de release-CI in (release/digests.json); tot dan is installeren niet gereed
# (digest_pending_release, met reden geaccepteerd tot de eerste release).
# Poorten staan alleen in network.ports (de vertaling bouwt daar de formulierpoorten uit); geen gedeeld Docker-netwerk.
# Geen HUB_* in parameters of env: HUB_URL, HUB_ENROLLMENT_TOKEN en HUB_KEY_FINGERPRINT voegt de vertaling zelf toe
# als de Hub koppelt (contract 1.3 §3.2).
manifest_version: "1"
app_id: appstore-en-fork
name: Appstore en fork
owner_repo: lvos04/appstore-en-fork
category: platform
description_nl: >-
  Appstore-catalogus van het platform: manifeststandaard (B08-001), validatie, catalogusbronnen en
  versiegeschiedenis van manifesten. API-dienst met alleen een kleine Nederlandse statuspagina; alle schermen staan
  in de Hub-UI van ai-server-manager.
version: "0.1.0"
install:
  method: custom_app
image:
  repository: ghcr.io/lvos04/appstore-en-fork
  tag: "0.1.0"
  digest: null
custom_app:
  storage:
    - name: appdata
      type: host_path
      host_path: {param: appdata_path}
  env: []
  resources:
    cpus: 1
    memory_mib: 768
  gpu: none
  run_as:
    mode: image_default
  timezone: {param: timezone}
  restart_policy: unless-stopped
  portal:
    port: api
    scheme: http
    path: /
    name: Statuspagina
parameters:
  - name: host_port
    type: port
    source: default
    default: 30430
    required: true
    description_nl: Hostpoort; voorstel uit het platformcontract, de Hub controleert vóór installatie op conflicten.
  - name: appdata_path
    type: path
    source: dataset_picker
    dataset_role: appstore_appdata
    decision: D02
    required: true
    description_nl: Dataset voor /appdata (ingebouwde database, geheimen en back-ups), gekozen in de datasetkiezer.
  - name: timezone
    type: timezone
    source: wizard
    required: true
    description_nl: Tijdzone van de NAS, gemeten of bevestigd in de onboarding-wizard.
  - name: rpo
    type: duration
    source: wizard
    decision: D16
    required: false
    description_nl: Maximaal toegestaan dataverlies (RPO), vastgelegd in de wizard (D16).
  - name: rto
    type: duration
    source: wizard
    decision: D16
    required: false
    description_nl: Maximaal toegestane hersteltijd (RTO), vastgelegd in de wizard (D16).
storage:
  - name: appdata
    mount: /appdata
    kind: data
    required_dataset_role: appstore_appdata
    description_nl: Database (PostgreSQL 16), /appdata/secrets en /appdata/backups.
network:
  ports:
    - name: api
      container_port: 30430
      host_port: {param: host_port}
      protocol: tcp
      purpose_nl: API, connectorcontract en statuspagina
  host_network: false
  host_network_reason: null
privileges:
  privileged: false
  cap_add: []
  devices: []
  gpu: none
privilege_reason: null
healthcheck:
  type: builtin
  # monitorplan (contract 1.3 §9): de beheerder neemt het over in Uptime Kuma en bevestigt het per monitor
  monitor: {pad: /readyz, verwachte_status: 200, timeout_s: 10, interval_s: 60}
backup:
  db_export:
    method: pg_dump
    description_nl: Automatische pg_dump vóór elke databasemigratie in /appdata/backups (nieuwste 3 blijven).
  snapshot_datasets: [appdata]
  rpo: {param: rpo}
  rto: {param: rto}
dependencies:
  - app_id: ai-server-manager
    kind: optional
    reason_nl: Koppelen (enrollment) en gebruikersrollen via de Hub; zonder Hub draait de catalogus zelfstandig.
sso: none
risk:
  install: R2
  update: R2
  uninstall: R2
upgrade:
  migrations: true
  tag_only_rollback_safe: false
  notes_nl: >-
    Alembic-migraties bij de start, met een pg_dump vooraf. Terug naar een oudere tag kan pas nadat het schema
    is teruggezet of de back-up/snapshot van vóór de update is hersteld.
decisions_required: [D01, D02, D16]
docs: [B08_APPSTORE_LIFECYCLE]
validation_status: unvalidated
compatibility:
  truenas_min_version: "24.10.2.2"
  truenas_max_version: null
  ix_app_min_version: "1.2.0"
provenance:
  source_repo: https://github.com/lvos04/appstore-en-fork
  source_commit: null
  upstream_repo: null
  license: GPL-3.0
accepted_findings:
  - code: digest_pending_release
    reden_nl: >-
      Eigen image vóór de eerste release: de release-CI vult de digest in (release/digests.json). Tot dan blokkeert
      de vertaling de installatie met digest_not_pinned.
