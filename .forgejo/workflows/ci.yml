name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: appstore-en-fork
    env:
      APPSTORE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: appstore-en-fork
          persist-credentials: false
      - name: Bronbranch van het platformcontract bepalen
        id: bron
        run: |
          ref=$(jq -er .bron_ref docs/platform-v2/CONTRACT_HERKOMST.json)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Privébron voor het platformcontract en Peil ophalen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: leon/ai-server-manager
          ref: ${{ steps.bron.outputs.ref }}
          token: ${{ secrets.BRON_LEESTOKEN }}
          path: ai-server-manager
          fetch-depth: 0
          persist-credentials: false
      - name: Contract 1.3 op de gepinde commit en de bronbranch vergelijken
        run: python3 tools/contract_kopie.py vergelijk --bron ../ai-server-manager
      - name: Peil met de bronbranch en de gepinde commit vergelijken
        run: |
          bron=../ai-server-manager
          pin=design/ontwerptaal/HERKOMST.json
          ref=$(jq -er .bron_ref "$pin")
          git -C "$bron" checkout --quiet --detach "origin/$ref" || git -C "$bron" checkout --quiet --detach origin/main
          python3 tools/peil_kopie.py vergelijk --bron "$bron"
          commit=$(jq -er .bron_commit "$pin")
          git -C "$bron" checkout --quiet --detach "$commit"
          jq -er '.bestanden[] | "\(.sha256)  \(.bron_pad)"' "$pin" | (cd "$bron" && sha256sum --strict --check)
          # De unit-tests vergelijken de renderer met de referentie op deze commit.
          test -f "$bron/design/ontwerptaal/bouw/sjabloon.py"
      - name: Afzonderlijke PostgreSQL-testdatabase starten
        run: bash .forgejo/testdatabase.sh
      - name: Python 3.12 op de Linux-runner
        run: |
          python3.12 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Afhankelijkheden (runtime met hashes + ontwikkeltools)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e apps/api
          python -m pip install --disable-pip-version-check ruff==0.17.4 mypy==2.4.1 pytest==9.2.0 \
            types-PyYAML==6.0.12.20261103 types-jsonschema==4.26.0.20261006 pip-audit==2.10.1
      - name: Ruff
        working-directory: appstore-en-fork/apps/api
        run: |
          ruff check src tests alembic && ruff format --check src tests alembic
          ruff check ../../tests/e2e ../../tests/ui ../../deploy/allinone ../../tools
          ruff format --check ../../tests/ui ../../tools
      - name: Mypy
        working-directory: appstore-en-fork/apps/api
        run: mypy
      - name: Manifest van deze app valideren (--strict, contract 1.3 §9)
        run: jl-manifest validate --strict --format json deploy/manifest/appstore-en-fork.manifest.yaml
      - name: Unit-tests
        working-directory: appstore-en-fork/apps/api
        run: pytest -q tests/unit
      - name: Integratietests (PostgreSQL)
        working-directory: appstore-en-fork/apps/api
        run: pytest -q tests/integration
      - name: Alembic up → down → up
        run: |
          export APPSTORE_DATABASE_URL="$APPSTORE_TEST_DATABASE_URL"
          appstore migrate && appstore migrate --down base && appstore migrate
          if appstore db-pending; then echo "migraties openstaand na upgrade" && exit 1; fi
      - name: OpenAPI-drift
        run: |
          appstore openapi --out "$RUNNER_TEMP/openapi.json"
          diff -u docs/openapi/appstore-en-fork.openapi.json "$RUNNER_TEMP/openapi.json"
      - name: Dienst-E2E (echte processen + Hub-simulator)
        run: pytest -q tests/e2e/test_service_e2e.py
      - name: pip-audit
        run: |
          cache=$(mktemp -d "$RUNNER_TEMP/pip-audit.XXXXXXXX")
          pip-audit -r apps/api/requirements.lock --require-hashes --disable-pip --progress-spinner off --cache-dir "$cache"

      - name: Eigen testdatabase opruimen
        if: always()
        run: bash .forgejo/testdatabase.sh stop

  statuspagina-ui:
    # statuspagina in Peil (ONTWERPTAAL §12/§13.2): de echte app rendert elke toestand (Hub-simulator, PostgreSQL);
    # Chromium toetst axe-core = 0, geen overloop op 320–1440 px, CSP zonder JS, doelen ≥ 44 px, tekst ≥ 14 px, focus
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Afzonderlijke PostgreSQL-testdatabase starten
        run: bash .forgejo/testdatabase.sh
      - name: Python 3.12 op de Linux-runner
        run: |
          python3.12 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Afhankelijkheden (Python met hashes, npm ci met lockfile)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e apps/api
          cd tests/ui
          npm ci --no-audit --no-fund
          node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Toestanden uit de echte app (niet gekoppeld, koppelen mislukt, gekoppeld, ingetrokken, niet gereed, …)
        run: python tests/ui/genereer_toestanden.py --uit tests/ui/uit
      - name: Playwright (axe-core, overloop, CSP, toetsenbord) + schermafdrukken
        working-directory: tests/ui
        env:
          SCHERMAFDRUKKEN: "1"
        run: node node_modules/@playwright/test/cli.js test
      - name: Ontwerpreview tegen de draaiende dienst (serve + worker + Hub-simulator; echte formulier-POST in Chromium)
        run: python tests/ui/review_live.py --meting tests/ui/peil-review
      - name: Schermafdrukken bewaren
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: statuspagina-peil
          path: |
            docs/screenshots/peil/statuspagina/*.png
            tests/ui/uit/
            tests/ui/peil-review/
          retention-days: 14

      - name: Eigen testdatabase opruimen
        if: always()
        run: bash .forgejo/testdatabase.sh stop

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Alles-in-één image bouwen en alle image-E2E uitvoeren
        env:
          APPSTORE_E2E_IMAGE: appstore-en-fork:ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash .forgejo/image-e2e.sh
