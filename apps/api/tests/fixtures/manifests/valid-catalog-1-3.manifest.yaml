# TESTFIXTURE (contract 1.3 §9) — fictieve catalogusapp met de nieuwe velden: install.reason, een geheim dat de Hub maakt
# (source generated + secret true), accepted_findings, container_port same_as_host, post_install_checks en een
# monitorplan. Alle waarden zijn testwaarden; geen echte NAS-gegevens.
manifest_version: "1"
app_id: voorbeeld-sso
name: Voorbeeld SSO
owner_repo: lvos04/appstore-en-fork
category: security
description_nl: Fictieve catalogusapp met verplichte geheime waarden, voor de tests van contract 1.3.
version: "2026.2.1"
install: {method: catalog_app, reason: meerdere_containers}
catalog: {train: community, app: voorbeeld-sso, version: "1.4.2"}
values:
  TZ: {param: timezone}
  voorbeeld:
    db_password: {param: db_password}
  storage:
    data:
      type: host_path
      host_path_config: {acl_enable: false, path: {param: data_path}}
  network:
    web_port: {bind_mode: published, port_number: {param: web_port}}
parameters:
  - {name: timezone, type: timezone, source: wizard, required: true, description_nl: Tijdzone van de NAS.}
  - {name: web_port, type: port, source: default, default: 30995, required: true, description_nl: Hostpoort.}
  - {name: db_password, type: string, source: generated, secret: true, required: true, description_nl: Databasewachtwoord dat de Hub maakt (vault).}
  - {name: data_path, type: path, source: dataset_picker, dataset_role: sso_data, decision: D02, required: true, description_nl: Dataset voor de gegevens.}
storage:
  - {name: data, mount: /data, kind: data, required_dataset_role: sso_data}
network:
  ports:
    - {name: web, container_port: same_as_host, host_port: {param: web_port}, protocol: tcp}
  host_network: false
privileges: {privileged: false, cap_add: [], devices: [], gpu: none}
healthcheck:
  type: builtin
  monitor: {pad: /-/health/live/, verwachte_status: 200, timeout_s: 10, interval_s: 60}
backup:
  db_export: {method: stopped_snapshot, description_nl: App stoppen en een ZFS-snapshot van de dataset; de stilstand telt mee in rto.}
  snapshot_datasets: [data]
  rpo: PT24H
  rto: PT8H
dependencies: []
sso: none
risk: {install: R2, update: R2, uninstall: R3}
upgrade: {migrations: true, tag_only_rollback_safe: false}
decisions_required: [D02]
docs: [B08_APPSTORE_LIFECYCLE]
validation_status: unvalidated
compatibility: {truenas_min_version: "25.04"}
accepted_findings:
  - code: secret_in_form
    reden_nl: De catalogusapp vereist het databasewachtwoord als privé-waarde; de Hub maakt het en geeft het alleen in de R2-actie mee.
post_install_checks:
  - {id: eerste_beheerder, soort: handmatig, beschrijving_nl: Maak het eerste beheerdersaccount aan; tot dan staat de setup-pagina open.}
