# TESTFIXTURE — fictieve catalogusapp; train/app/versie zijn testwaarden.
manifest_version: "1"
app_id: voorbeeld-catalogus
name: Voorbeeld catalogus
owner_repo: lvos04/appstore-en-fork
category: photos
description_nl: Fictieve catalogusapp met meerdere containers voor de tests.
version: "2.4.1"
install: {method: catalog_app}
catalog: {train: community, app: voorbeeldapp, version: "1.6.12"}
values:
  TZ: {param: timezone}
  storage:
    library:
      type: host_path
      host_path_config: {acl_enable: false, path: {param: library_path}}
  network:
    web_port: {bind_mode: published, port_number: {param: web_port}}
parameters:
  - {name: timezone, type: timezone, source: wizard, required: true, description_nl: Tijdzone van de NAS.}
  - {name: library_path, type: path, source: dataset_picker, dataset_role: photo_library, decision: D02, required: true, description_nl: Fotodataset.}
  - {name: web_port, type: port, source: default, default: 30998, required: true, description_nl: Hostpoort.}
storage:
  - {name: library, mount: /data, kind: media, required_dataset_role: photo_library}
network:
  ports:
    - {name: web, container_port: 2283, host_port: {param: web_port}, protocol: tcp}
  host_network: false
  joins_platform_network: false
privileges: {privileged: false, cap_add: [], devices: [], gpu: none}
healthcheck: {type: builtin}
backup:
  db_export: {method: app_native, description_nl: Ingebouwde database-dump van de app.}
  snapshot_datasets: [library]
  rpo: PT24H
  rto: PT8H
dependencies: []
sso: oidc
risk: {install: R2, update: R2, uninstall: R3}
upgrade: {migrations: true, tag_only_rollback_safe: false}
decisions_required: [D02]
docs: [A10_IMMICH]
validation_status: unvalidated
compatibility: {truenas_min_version: "25.04"}
