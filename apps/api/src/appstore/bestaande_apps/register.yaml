# Register van bekende bestaande apps (B08-002, APP-01…APP-20).
#
# Bron van de teksten: docs/platform-v2/04_BESTAANDE_APPS/APP_REGISTER.md en A01…A20 (pakket 2026-11-09); de unit-test
# tests/unit/test_bestaande_apps_register.py controleert dat elke tekst letterlijk in die documenten staat.
# Dit register zegt NIETS over de NAS van de gebruiker: geen versies, tags, digests, poorten, datasets of adressen.
# Die komen uitsluitend als gemeten readback uit de Hub-inventaris (GET /api/v1/apps van de Hub).
#
# Herkenning (alleen een VOORSTEL; de eigenaar bevestigt altijd zelf, B08-002):
# - catalogus_apps: exacte naam van de TrueNAS-catalogusapp (metadata.name), bronwaarneming in truenas/apps op commit
#   69dfbda33a5e19eb4cb3441904a44e813b5b3fba (trains stable en community), gelezen 2026-11-09.
# - image_repositories: (a) de image uit ix_values.yaml van die catalogusapp op dezelfde commit, (b) eigen images uit
#   platformcontract 1.2 §2.3 en de gepubliceerde images in de release-workflows van die repos
#   (media-guard-ultimate@da1bebe, media-source-optimizer@2d04321, my_house@c3297e2; oudere installaties met
#   meerdere containers), (c) upstream-images waarvan het bestaan op 2026-11-09 met
#   `docker buildx imagetools inspect` is gecontroleerd. Een niet-bestaande kandidaat (lscr.io/linuxserver/readarr,
#   sabnzbd/sabnzbd) staat er bewust niet in.
# - Op appnaam alleen wordt nooit herkend. Snapotter, Teeltboek en Uren hebben géén herkenning (A06: "geen afleiding
#   uit appnaam"): alleen een beheerder kan ze handmatig koppelen.
register_versie: "2026-11-09.1"
bron: docs/platform-v2/04_BESTAANDE_APPS (APP_REGISTER.md + A01…A20), pakket 2026-11-09
herkenning_bron:
  truenas_catalogus: truenas/apps@69dfbda33a5e19eb4cb3441904a44e813b5b3fba (2026-11-09)
  eigen_images: platformcontract 1.2 §2 en §2.3; release-workflows media-guard-ultimate@da1bebe, media-source-optimizer@2d04321, my_house@c3297e2
  upstream_gecontroleerd_op: "2026-11-09"
# Eigen nieuwe diensten van het platform (contract 1.2 §2, vaste app_id en image). Geen APP-ID en geen beslisregister:
# hun levenscyclus loopt via het platform zelf. Alleen herkenning op de exacte image-repository.
platform_apps:
  - {app_id: ai-server-manager, naam: "Hub (AI Server Manager)", repo: lvos04/ai-server-manager, image_repositories: [ghcr.io/lvos04/ai-server-manager]}
