  - {app_id: appstore-en-fork, naam: Appstore en fork, repo: lvos04/appstore-en-fork, image_repositories: [ghcr.io/lvos04/appstore-en-fork]}
  - {app_id: jelly-leon-platform, naam: Jelly Leon-platform, repo: lvos04/jelly-leon-platform, image_repositories: [ghcr.io/lvos04/jelly-leon-platform]}
  - {app_id: zoeken-en-persoonlijke-ai, naam: Zoeken en persoonlijke AI, repo: lvos04/zoeken-en-persoonlijke-ai, image_repositories: [ghcr.io/lvos04/zoeken-en-persoonlijke-ai]}
